name: Refresh profile stats

on:
  schedule:
    # 01:30 UTC daily — after most of a working day has landed.
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/gen_stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          # PAT needs `repo` + `read:org` so private contributions are counted.
          # Falls back to GITHUB_TOKEN, which only sees public data.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
